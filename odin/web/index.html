<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feretory of SPLORR!!</title>
<style>
	@font-face {
		font-family: 'Web437_IBM_CGA';
		src: url('fonts/Web437_IBM_CGA.woff') format('woff');
		font-weight: normal;
		font-style: normal;
	}
	html, body {
		font-family: 'Web437_IBM_CGA', Helvetica, Arial, sans-serif;
		background-color: #101;
		color: #969696;
		margin: 0;
	}
	article { width: 80%; max-width: 960px; margin: 0 auto; padding-top: 1.1rem; }
	h1 { font-size: 2.5rem; font-weight: 500; margin: 0 0 .5rem; }
	p { margin: 0 0 1rem; }
	a { color: #00897b; }
	.stage { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; margin-bottom: 1rem; }
	.grid { display: grid; grid-template-columns: repeat(var(--cols), 16px); grid-auto-rows: 16px; line-height: 16px; font-size: 16px; }
	.grid > span { display: block; width: 16px; height: 16px; text-align: center; overflow: hidden; }
	.narrative { flex: 1 1 18rem; min-width: 0; }
	.prompt-title { color: #00897b; }
	.choice-button {
		border-radius: 12px; padding: 10px 20px; border: 1px solid #282828;
		margin-right: 15px; margin-bottom: 15px; background-color: #969696; color: #282828;
		font: inherit; cursor: pointer;
	}
	input {
		border-radius: 12px; padding: 10px 20px; border: 1px solid;
		margin-right: 15px; margin-bottom: 15px; font: inherit;
	}
	.fatal { color: #fff; background: #b32121; padding: .6rem 1rem; }
</style>
</head>
<body>
<article id="app"></article>
<script type="text/javascript" src="odin.js"></script>
<script>
(function () {
	"use strict";
	const app = document.getElementById("app");
	const memory = new odin.WasmMemoryInterface();
	const decoder = new TextDecoder();
	const encoder = new TextEncoder();
	const str = (ptr, len) => decoder.decode(new Uint8Array(memory.memory.buffer, ptr, len));
	const exp = () => memory.exports;

	// IBM CGA palette, the colors the Blazor page used for fg0-15 and bg0-15.
	const CGA = [
		"#000000", "#0000AA", "#00AA00", "#00AAAA", "#AA0000", "#AA00AA", "#AA5500", "#AAAAAA",
		"#555555", "#5555FF", "#55FF55", "#55FFFF", "#FF5555", "#FF55FF", "#FFFF55", "#FFFFFF",
	];

	let stage = null;       // grid and narrative side by side
	let gridBox = null;
	let narrative = null;
	let focusTarget = null;
	let textBox = null;

	function ensureStage() {
		if (stage) return;
		stage = document.createElement("div");
		stage.className = "stage";
		narrative = document.createElement("div");
		narrative.className = "narrative";
		stage.appendChild(narrative);
		app.appendChild(stage);
	}

	const imports = {
		env: {
			dom_clear() {
				app.replaceChildren();
				stage = gridBox = narrative = null;
				focusTarget = null;
				textBox = null;
			},
			dom_grid_begin(cols, rows) {
				ensureStage();
				gridBox = document.createElement("div");
				gridBox.className = "grid";
				gridBox.style.setProperty("--cols", cols);
				stage.insertBefore(gridBox, narrative);
			},
			dom_cell(ch, attr, tp, tl) {
				const cell = document.createElement("span");
				cell.textContent = String.fromCharCode(ch);
				cell.style.color = CGA[attr & 15];
				cell.style.backgroundColor = CGA[attr >> 4];
				const tip = str(tp, tl);
				if (tip) cell.title = tip;
				gridBox.appendChild(cell);
			},
			dom_element(kind, tp, tl, hp, hl, newLine) {
				ensureStage();
				const text = str(tp, tl);
				if (kind === 1) {
					const h = document.createElement("h1");
					h.textContent = text;
					narrative.appendChild(h);
					return;
				}
				let el;
				if (kind === 2) {
					el = document.createElement("a");
					el.href = str(hp, hl);
					el.target = "_blank";
					el.rel = "noopener noreferrer";
				} else {
					el = document.createElement("span");
				}
				el.textContent = text;
				narrative.appendChild(el);
				if (newLine) narrative.appendChild(document.createElement("br"));
			},
			dom_prompt(kind, tp, tl, ip, il) {
				const title = document.createElement("p");
				title.className = "prompt-title";
				title.textContent = str(tp, tl);
				app.appendChild(title);
				if (kind === 0) return;
				const form = document.createElement("form");
				const input = document.createElement("input");
				input.type = "text";
				input.required = true;
				input.maxLength = 32;
				input.autocomplete = "off";
				input.value = str(ip, il);
				textBox = input;
				const go = document.createElement("button");
				go.type = "submit";
				go.className = "choice-button";
				go.textContent = "GO!";
				form.append(input, go);
				form.addEventListener("submit", (ev) => {
					ev.preventDefault();
					if (input.value.trim() !== "") exp().on_submit_text();
				});
				app.appendChild(form);
				focusTarget = input;
				input.select();
			},
			dom_choice(index, tp, tl) {
				const b = document.createElement("button");
				b.className = "choice-button";
				b.textContent = str(tp, tl);
				b.addEventListener("click", () => exp().on_choice(index));
				app.appendChild(b);
				if (index === 0 && !focusTarget) focusTarget = b;
			},
			dom_end() {
				if (focusTarget) focusTarget.focus({ preventScroll: true });
			},
			storage_get(keyPtr, keyLen, bufPtr, cap) {
				try {
					const v = localStorage.getItem(str(keyPtr, keyLen));
					if (v === null) return -1;
					const bytes = encoder.encode(v);
					if (bytes.length > cap) return -1;
					new Uint8Array(memory.memory.buffer, bufPtr, bytes.length).set(bytes);
					return bytes.length;
				} catch (e) {
					return -1;
				}
			},
			storage_set(keyPtr, keyLen, valPtr, valLen) {
				try {
					localStorage.setItem(str(keyPtr, keyLen), str(valPtr, valLen));
				} catch (e) {
					/* storage blocked or full: the game still plays, it just will not resume */
				}
			},
			read_text(bufPtr, cap) {
				const bytes = encoder.encode(textBox ? textBox.value.trim() : "");
				if (bytes.length > cap) return 0;
				new Uint8Array(memory.memory.buffer, bufPtr, bytes.length).set(bytes);
				return bytes.length;
			},
		},
	};

	odin.runWasm("game.wasm", null, imports, memory).catch((e) => {
		const d = document.createElement("div");
		d.className = "fatal";
		d.textContent = "Could not start the game: " + e;
		document.body.prepend(d);
	});
})();
</script>
</body>
</html>
